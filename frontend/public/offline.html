<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <title>Sin conexión · Sport Management</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #1f2937;
    }
    .card { max-width: 24rem; width: 100%; text-align: center; }
    .badge {
      width: 72px; height: 72px; margin: 0 auto 1.25rem;
      border-radius: 24px; background: #c8102e;
      display: flex; align-items: center; justify-content: center;
    }
    .badge span { width: 34px; height: 34px; border-radius: 50%; background: #fff; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; letter-spacing: -0.01em; }
    p { font-size: .9rem; line-height: 1.5; margin: 0 0 1.5rem; color: #6b7280; }
    button {
      width: 100%; min-height: 48px; border: 0; border-radius: 14px;
      background: #c8102e; color: #fff; font-size: .8rem; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    }
    button:active { background: #a00d25; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #c9d1d9; }
      p { color: #8b949e; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span></span></div>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Los datos del club necesitan red para cargarse. Vuelve a intentarlo cuando recuperes la señal.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
