<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Campo de fútbol completo - Vista de Ataque -->
  <defs>
    <linearGradient id="fieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo del campo -->
  <rect width="1200" height="800" fill="url(#fieldGradient)" />

  <!-- Línea de banda superior -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="4" />

  <!-- Línea de banda inferior -->
  <line x1="0" y1="800" x2="1200" y2="800" stroke="white" stroke-width="4" />

  <!-- Línea de banda izquierda -->
  <line x1="0" y1="0" x2="0" y2="800" stroke="white" stroke-width="4" />

  <!-- Línea de banda derecha -->
  <line x1="1200" y1="0" x2="1200" y2="800" stroke="white" stroke-width="4" />

  <!-- Línea media -->
  <line x1="600" y1="0" x2="600" y2="800" stroke="white" stroke-width="3" />

  <!-- Círculo central -->
  <circle cx="600" cy="400" r="90" fill="none" stroke="white" stroke-width="3" />

  <!-- Punto central -->
  <circle cx="600" cy="400" r="6" fill="white" />

  <!-- Área de portería derecha (ataque) -->
  <rect x="1000" y="200" width="200" height="400" fill="none" stroke="white" stroke-width="3" />

  <!-- Área de penalti derecha -->
  <rect x="1050" y="150" width="150" height="500" fill="none" stroke="white" stroke-width="2" />

  <!-- Semicírculo de penalti derecha -->
  <path d="M 1050 150 Q 1050 50 1200 50 L 1200 750 Q 1050 750 1050 650" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Portería derecha -->
  <rect x="1200" y="300" width="4" height="200" fill="white" />

  <!-- Área de portería izquierda (defensa) -->
  <rect x="0" y="200" width="200" height="400" fill="none" stroke="white" stroke-width="3" />

  <!-- Área de penalti izquierda -->
  <rect x="0" y="150" width="150" height="500" fill="none" stroke="white" stroke-width="2" />

  <!-- Semicírculo de penalti izquierda -->
  <path d="M 150 150 Q 150 50 0 50 L 0 750 Q 150 750 150 650" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5,5" />

  <!-- Portería izquierda -->
  <rect x="-4" y="300" width="4" height="200" fill="white" />

  <!-- Banderines de esquina -->
  <circle cx="10" cy="10" r="8" fill="none" stroke="white" stroke-width="2" />
  <circle cx="1190" cy="10" r="8" fill="none" stroke="white" stroke-width="2" />
  <circle cx="10" cy="790" r="8" fill="none" stroke="white" stroke-width="2" />
  <circle cx="1190" cy="790" r="8" fill="none" stroke="white" stroke-width="2" />

  <!-- Etiqueta -->
  <text x="600" y="750" font-size="28" font-weight="bold" text-anchor="middle" fill="white" opacity="0.6">CAMPO DE ATAQUE</text>
</svg>
